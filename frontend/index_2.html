<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Получение сообщений, отправленных посредством алгоритмов шифрования</title>

    <style>
        * {
            font-family: Comic Sans MS, Comic Sans, cursive;
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #343434;
            padding: 20px;
            padding-top: 5vh;
        }

        .main-container {
            width: 100%;
            max-width: 1200px;
            position: relative;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        h1 {
            text-align: center;
            color: #34aa65;
            text-shadow: 2px 2px 4px #194029,
                        3px 4px 4px #0f2418,
                        4px 6px 4px #142e1e,
                        5px 8px 4px #13301f;
            margin-bottom: 30px;
            font-size: clamp(1.5rem, 4vw, 2.5rem);
        }

        .title-1 {
            color: #34aa65;
            text-shadow: 2px 2px 4px #194029,
                        3px 4px 4px #0f2418,
                        4px 6px 4px #142e1e,
                        5px 8px 4px #13301f;
            margin-bottom: 20px;
            font-size: clamp(0.8rem, 3vw, 1rem);
        }

        .content-wrapper {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            align-items: flex-start;
            margin-bottom: 20px;
        }

        .messages-column {
            flex: 1;
            min-width: 300px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .keys-column {
            flex: 0 0 350px;
            min-width: 300px;
        }

        .text-output-cypher,
        .text-output {
            width: 100%;
            padding: 12px;
            border: 3px solid #2c8853;
            border-radius: 8px;
            font-size: clamp(14px, 2vw, 16px);
            transition: border-color 0.3s, box-shadow 0.3s;
            min-height: 120px;
            resize: vertical;
            background: #2d2d2d;
            color: #e0e0e0;
        }

        .text-output-cypher:focus,
        .text-output:focus {
            outline: none;
            border-color: #50f394;
            box-shadow: 0 0 10px 2px rgba(16, 162, 123, 0.736);
        }

        .rsa-key-block {
            background: #2d2d2d;
            border: 2px solid #2980b9;
            border-radius: 8px;
            padding: 15px;
            word-wrap: break-word;
        }

        .rsa-key-block h3 {
            color: #3498db;
            margin: 0 0 15px 0;
            font-size: clamp(14px, 2vw, 16px);
            cursor: pointer;
            display: inline-block;
            transition: color 0.3s ease;
        }

        .rsa-key-block h3:hover {
            color: #5dade2;
            text-decoration: underline;
        }

        .rsa-key-block h3::after {
            font-size: 0.8em;
            opacity: 0.7;
        }

        .keys-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .key-item strong {
            color: #3498db;
            font-size: clamp(11px, 1.5vw, 12px);
            display: block;
            margin-bottom: 5px;
        }

        .key-item p {
            color: #85c1e9;
            margin: 0;
            font-size: clamp(10px, 1.3vw, 11px);
            background: #1a1a1a;
            padding: 10px;
            border-radius: 4px;
            word-break: break-all;
            min-height: 40px;
            max-height: 120px;
            overflow-y: auto;
        }

        .tooltip {
            position: absolute;
            background: #2c3e50;
            color: #ecf0f1;
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.6;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid #3498db;
            z-index: 1001;
            animation: tooltipFadeIn 0.3s ease;
            word-wrap: break-word;
        }

        .tooltip::before {
            content: '';
            position: absolute;
            top: -10px;
            left: 20px;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-bottom: 10px solid #3498db;
        }

        @keyframes tooltipFadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .connection-status {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            color: #e74c3c;
            font-size: clamp(12px, 1.5vw, 14px);
            background: #2d2d2d;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid #e74c3c;
            text-align: center;
            z-index: 1000;
            max-width: 300px;
            margin: 0 auto;
        }

        .connection-status.connected {
            color: #2ecc71;
            border-color: #2ecc71;
        }

        @media (max-width: 1024px) {
            .content-wrapper {
                gap: 20px;
            }
            
            .keys-column {
                flex: 0 0 300px;
            }
            
            .tooltip {
                max-width: 300px;
                font-size: 13px;
            }
        }

        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            .main-container {
                padding: 10px;
            }

            .content-wrapper {
                flex-direction: column;
                gap: 15px;
            }

            .messages-column,
            .keys-column {
                min-width: 100%;
                flex: 1;
            }

            .text-output-cypher,
            .text-output {
                min-height: 100px;
                font-size: 16px;
            }

            .connection-status {
                left: 10px;
                right: 10px;
                bottom: 10px;
                max-width: calc(100% - 20px);
            }
            
            .tooltip {
                max-width: 250px;
                font-size: 12px;
                position: fixed;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
            }
            
            .tooltip::before {
                display: none;
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 1.3rem;
            }

            .title-1 {
                font-size: 0.8rem;
            }

            .rsa-key-block {
                padding: 10px;
            }

            .rsa-key-block h3 {
                font-size: 0.85rem;
            }
            
            .tooltip {
                max-width: 90vw;
                font-size: 11px;
            }

            .key-item p {
                max-height: 80px;
                font-size: 9px;
            }
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        .text-output-cypher::-webkit-scrollbar-track,
        .text-output::-webkit-scrollbar-track {
            background: #1a1a1a;
        }

        .text-output-cypher::-webkit-scrollbar-thumb,
        .text-output::-webkit-scrollbar-thumb {
            background: #2c8853;
            border-radius: 4px;
        }

        .text-output-cypher::-webkit-scrollbar-thumb:hover,
        .text-output::-webkit-scrollbar-thumb:hover {
            background: #50f394;
        }

        .key-item p::-webkit-scrollbar-track {
            background: #1a1a1a;
        }

        .key-item p::-webkit-scrollbar-thumb {
            background: #2980b9;
            border-radius: 4px;
        }

        .key-item p::-webkit-scrollbar-thumb:hover {
            background: #3498db;
        }
    </style>
</head>
<body>
    <div class="main-container">
        <h1>Получение сообщений</h1>

        <div class="title-1">
            <h2>Полученные сообщения</h2>
        </div>

        <div class="content-wrapper">
            <div class="messages-column">
                <div class="received-cypher">
                    <textarea class="text-output-cypher" 
                              id="text-output-cypher" 
                              placeholder="Здесь будут отображаться полученные сообщения в зашифрованном виде..."
                              readonly></textarea>
                </div>
                <div class="received">
                    <textarea class="text-output" 
                              id="text-output" 
                              placeholder="Здесь будут отображаться полученные сообщения в расшифрованном виде..."
                              readonly></textarea>
                </div>
            </div>

            <div class="keys-column">
                <div class="rsa-key-block">
                    <h3 id="rsa-key-title">RSA ключи</h3>
                    <div class="keys-container">
                        <div class="key-item">
                            <strong>Public key:</strong>
                            <p id="key-rsa-public"></p>
                        </div>
                        <div class="key-item">
                            <strong>Private key:</strong>
                            <p id="key-rsa-private"></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="connection-status" id="connection-status">
            Статус: отключен
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const TextOut = document.getElementById('text-output');
            const TextOutCypher = document.getElementById('text-output-cypher');
            const RSAPublicKey = document.getElementById('key-rsa-public');
            const RSAPrivateKey = document.getElementById('key-rsa-private');
            const RSAKeyTitle = document.getElementById('rsa-key-title');
            const ConnectionStatus = document.getElementById('connection-status');

            let currentTooltip = null;
            let ws = null;
            let reconnectAttempts = 0;
            const reconnectDelay = 3000;
            let s_cypher = 1;
            let s = 1;

            function connectWebsocket() {
                ws = new WebSocket('ws://193.109.78.189:9002/ws');

                ws.addEventListener('open', (event) => {
                    ConnectionStatus.textContent = 'Статус: Подключен';
                    ConnectionStatus.classList.add('connected');
                    reconnectAttempts = 0;
                });

                ws.addEventListener('message', (event) => {
                    const data = JSON.parse(event.data);
                    console.log(event.data);

                    if (data.rsa_public && data.rsa_private) {
                        RSAPublicKey.textContent = data.rsa_public;
                        RSAPrivateKey.textContent = data.rsa_private;
                    }

                    if (data.encrypted) {
                        TextOutCypher.value += `[Зашифрованное ${s_cypher}]: ${data.encrypted}\n`;
                        TextOutCypher.scrollTop = TextOutCypher.scrollHeight;
                        s_cypher++;
                    }

                    if (data.decrypted) {
                        console.log('Получено расшифрованное сообщение: ', data.decrypted);
                        TextOut.value += `[Расшифрованное ${s}]: ${data.decrypted}\n`;
                        TextOut.scrollTop = TextOut.scrollHeight;
                        s++;
                    }
                });

                ws.addEventListener('error', (event) => {
                    console.log('Произошла WebSocket ошибка: ', event.data);
                    ConnectionStatus.textContent = 'Статус: ошибка';
                    ConnectionStatus.classList.remove('connected');
                });

                ws.addEventListener('close', (event) => {
                    console.log('Соединение закрыто: ', event.code, event.reason);
                    ConnectionStatus.textContent = 'Статус: отключен';
                    ConnectionStatus.classList.remove('connected');

                    attemptReconnect();
                });
            }

            function attemptReconnect() {
                reconnectAttempts++;
                ConnectionStatus.textContent = `Статус: переподключение, попытка номер: ${reconnectAttempts}`;

                setTimeout(() => {
                    console.log(`Попытка переподключения: ${reconnectAttempts}`);
                    connectWebsocket();
                }, reconnectDelay);
            }

            connectWebsocket();
            //окончание блока подключения по WebSocket

            function showTooltip(element, text) {
                removeTooltip();
                
                const tooltip = document.createElement('div');
                tooltip.className = 'tooltip';
                tooltip.textContent = text;
                
                const rect = element.getBoundingClientRect();
                const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
                
                if (window.innerWidth <= 768) {
                    tooltip.style.position = 'fixed';
                    tooltip.style.top = '50%';
                    tooltip.style.left = '50%';
                } else {
                    tooltip.style.position = 'absolute';
                    tooltip.style.top = rect.bottom + scrollTop + 10 + 'px';
                    tooltip.style.left = rect.left + 'px';
                }
                
                document.body.appendChild(tooltip);
                currentTooltip = tooltip;
                
                setTimeout(() => {
                    document.addEventListener('click', closeTooltipOnClickOutside);
                    document.addEventListener('touchstart', closeTooltipOnClickOutside);
                }, 0);
            }
            
            function removeTooltip() {
                if (currentTooltip) {
                    currentTooltip.remove();
                    currentTooltip = null;
                    document.removeEventListener('click', closeTooltipOnClickOutside);
                    document.removeEventListener('touchstart', closeTooltipOnClickOutside);
                }
            }
            
            function closeTooltipOnClickOutside(event) {
                if (currentTooltip && !currentTooltip.contains(event.target) && event.target !== RSAKeyTitle) {
                    removeTooltip();
                }
            }

            RSAKeyTitle.addEventListener('click', (event) => {
                event.stopPropagation();
                
                const tooltipText = 'RSA-ключ — это пара математических ключей, которые используются в асимметричном криптографическом алгоритме RSA (Rivest–Shamir–Adleman).';
                
                if (currentTooltip) {
                    removeTooltip();
                } else {
                    showTooltip(RSAKeyTitle, tooltipText);
                }
            });

            window.addEventListener('online', () => {
                if (!ws || ws.readyState === WebSocket.CLOSED) {
                    ConnectionStatus.textContent = 'Статус: переподключение...';
                    reconnectAttempts = 0;
                    connectWebsocket();
                }
            });

            window.addEventListener('offline', () => {
                ConnectionStatus.textContent = 'Статус: нет интернета';
                ConnectionStatus.classList.remove('connected');

                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.close();
                }
            });
            
            window.addEventListener('resize', () => {
                if (currentTooltip) {
                    removeTooltip();
                }
            });
        });
    </script>
</body>
</html>
