<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Передача сообщений посредством алгоритмов шифрования</title>

    <style>
        * {
            font-family: Comic Sans MS, Comic Sans, cursive;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #343434;
        }

        h1 {
            position: relative;
            text-align: center;
            color: #34aa65;
            text-shadow: 2px 2px 4px #194029,
                        3px 4px 4px #0f2418,
                        4px 6px 4px #142e1e,
                        5px 8px 4px #13301f;
        }

        .title-1 {
            position: absolute;
            top: 10vh;
            left: 2vw;
            color: #34aa65;
            text-shadow: 2px 2px 4px #194029,
                        3px 4px 4px #0f2418,
                        4px 6px 4px #142e1e,
                        5px 8px 4px #13301f;
        }

        .text-form {
            position: absolute;
            top: 20vh;
            left: 2vw;
            max-width: 500px;
            margin: 0 auto;
        }

        .text-group {
            margin-bottom: 3vh;
        }

        .mail-btn {
            position: relative;
        }

        .text-input {
            width: 100%;
            padding: 10px;
            border: 3px solid #2c8853;
            border-radius: 4px;
            font-size: 16px;
            transition: border-color 0.3s;
            font-size: 16px;
            min-height: 100px;
            resize: vertical;
        }

        .text-input:focus {
            outline: none;
            border-color: #2c8853;
            box-shadow: 0 0 5px 2px rgba(16, 162, 123, 0.736);
        }

        .mail-btn {
            width: 7vw;
            height: 5vh;
            background: #2c8853;
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 16px;
            cursor: default;
            transition: transform 0.4s cubic-bezier(0.1, 0.5, 0.5, 0.9);
        }

        .mail-btn:hover {
            background: #50f394;
            transform: scale(1.05);
        }

        .mail-btn:focus {
            transform: scale(1.05);
        }

        .mail-btn:active {
            transform: scale(0.98);
        }

        .aes-btn {
            position: absolute;
            top: 20vh;
            right: 25vw;
            width: 11vw;
            height: 5vh;
            background: #2c8853;
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 12px;
            cursor: default;
            transition: transform 0.4s cubic-bezier(0.1, 0.5, 0.5, 0.9);
        }

        .aes-btn:hover {
            background: #3498bd;
            transform: scale(1.1);
        }

        .aes-btn:focus {
            transform: scale(1.05);
        }

        .aes-btn:active {
            transform: scale(0.98);
        }

        .aes-key-block {
            position: absolute;
            top: 1vh;
            right: 15vw;
            background: #2d2d2d;
            border: 2px solid #2980b9;
            border-radius: 8px;
            padding: 15px;
            max-width: 300px;
            word-wrap: break-word;
        }

        .aes-key-block h3 {
            color: #3498db;
            margin: 0 0 10px 0;
            font-size: 16px;
            width: 20vw;
        }

        .aes-key-block p {
            color: #85c1e9;
            margin: 0;
            font-size: 12px;
            background: #1a1a1a;
            padding: 10px;
            border-radius: 4px;
        }

        .connection-status {
            position: fixed;
            bottom: 20px;
            left: 20px;
            color: #e74c3c;
            font-size: 14px;
            background: #2d2d2d;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #e74c3c;
        }

        .connection-status.connected {
            color: #2ecc71;
            border-color: #2ecc71;
        }
    </style>
</head>
<body>
    <div class="main-menu-container">
        <h1>Передача сообщений</h1>

        <form class="text-form" id="text-form">
            <div class="text-group">
                <textarea class="text-input"
                          id="text-input"
                          placeholder="Напишите что-нибудь..."
                          cols="100"></textarea>
            </div>

            <button type="submit" class="mail-btn" id="mail-btn">Отправить</button>
        </form>

        <button type="submit" class="aes-btn" id="aes-btn">Сгенерировать AES ключ</button>

        <div class="aes-key-block">
            <h3>AES ключ</h3>
            <p id="aes-key-value"></p>
        </div>

        <div class="title-1" id="title-1">
            <h2>Отправляйте сообщения</h2>
        </div>

        <div class="connection-status" id="connection-status">
            Статус: отключен
        </div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const TextInput = document.getElementById('text-input');
            const MailBtn = document.getElementById('mail-btn');
            const AESBtn = document.getElementById('aes-btn');
            const AESKeyValue = document.getElementById('aes-key-value');
            const ConnectionStatus = document.getElementById('connection-status');
            const TextForm = document.getElementById('text-form');

            const ws = new WebSocket('ws://185.255.133.17:8081/ws');

            ws.addEventListener('open', (event) => {
                ConnectionStatus.textContent = 'Статус: Подключен';
                ConnectionStatus.classList.add('connected');
            });

            ws.addEventListener('message', (event) => {
                const data = JSON.parse(event.data);
                console.log(event.data);

                if (data.AES_key) {
                    AESKeyValue.textContent = data.AES_key;
                }
            });

            ws.addEventListener('error', (event) => {
                console.log('Произошла WebSocket ошибка: ', event.data);
                ConnectionStatus.textContent = 'Статус: ошибка';
            });

            ws.addEventListener('close', (event) => {
                console.log('Соединение закрыто: ', event.code, event.reason);
                ConnectionStatus.textContent = 'Статус: отключен';
                ConnectionStatus.classList.remove('connected');
            });

            MailBtn.addEventListener('click', (event) => {
                event.preventDefault();
                sendMessage(TextInput.value.trim());
            });

            AESBtn.addEventListener('click', () => {
                ws.send(JSON.stringify({
                    AES_key: ""
                }));
            });

            TextForm.addEventListener('submit', (event) => {
                event.preventDefault();
            });

            function sendMessage(message) {
                if(!message) return;

                ws.send(JSON.stringify({
                    message: message
                }));

                TextInput.value = '';
            }
        });
    </script>
</body>
</html>
