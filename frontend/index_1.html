<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Передача сообщений посредством алгоритмов шифрования</title>

    <style>
        * {
            font-family: Comic Sans MS, Comic Sans, cursive;
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #343434;
            padding: 20px;
            padding-top: 5vh;
        }

        .main-menu-container {
            width: 100%;
            max-width: 1200px;
            position: relative;
            padding: 20px;
            display: flex;
            flex-direction: column;
            min-height: auto;
        }

        h1 {
            text-align: center;
            color: #34aa65;
            text-shadow: 2px 2px 4px #194029,
                        3px 4px 4px #0f2418,
                        4px 6px 4px #142e1e,
                        5px 8px 4px #13301f;
            margin-bottom: 30px;
            font-size: clamp(1.5rem, 4vw, 2.5rem);
        }

        .title-1 {
            color: #34aa65;
            text-shadow: 2px 2px 4px #194029,
                        3px 4px 4px #0f2418,
                        4px 6px 4px #142e1e,
                        5px 8px 4px #13301f;
            margin-bottom: 20px;
            font-size: clamp(0.8rem, 3vw, 1rem);
        }

        .content-wrapper {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            align-items: flex-start;
        }

        .left-column {
            flex: 1;
            min-width: 300px;
        }

        .right-column {
            flex: 1;
            min-width: 300px;
        }

        .text-form {
            margin-bottom: 20px;
        }

        .text-group {
            margin-bottom: 15px;
        }

        .text-input {
            width: 100%;
            padding: 12px;
            border: 3px solid #2c8853;
            border-radius: 8px;
            font-size: clamp(14px, 2vw, 16px);
            transition: border-color 0.3s, box-shadow 0.3s;
            min-height: 120px;
            resize: vertical;
            background: #2d2d2d;
            color: #e0e0e0;
        }

        .text-input:focus {
            outline: none;
            border-color: #50f394;
            box-shadow: 0 0 10px 2px rgba(16, 162, 123, 0.736);
        }

        .text-input::placeholder {
            color: #888;
        }

        .buttons-container {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .mail-btn {
            padding: 12px 24px;
            background: #2c8853;
            color: white;
            border: none;
            border-radius: 16px;
            font-size: clamp(14px, 2vw, 16px);
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
            min-width: 120px;
        }

        .mail-btn:hover {
            background: #50f394;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(46, 204, 113, 0.3);
        }

        .mail-btn:active {
            transform: translateY(0);
        }

        .aes-btn {
            padding: 12px 24px;
            background: #2c8853;
            color: white;
            border: none;
            border-radius: 16px;
            font-size: clamp(12px, 1.8vw, 14px);
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
            min-width: 180px;
        }

        .aes-btn:hover {
            background: #3498bd;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(52, 152, 219, 0.3);
        }

        .aes-btn:active {
            transform: translateY(0);
        }

        .aes-key-block {
            background: #2d2d2d;
            border: 2px solid #2980b9;
            border-radius: 8px;
            padding: 15px;
            word-wrap: break-word;
            margin-top: 0;
        }

        .aes-key-block h3 {
            color: #3498db;
            margin: 0 0 10px 0;
            font-size: clamp(14px, 2vw, 16px);
            cursor: pointer;
            position: relative;
            display: inline-block;
            transition: color 0.3s ease;
        }

        .aes-key-block h3:hover {
            color: #5dade2;
            text-decoration: underline;
        }

        .aes-key-block h3::after {
            font-size: 0.8em;
            opacity: 0.7;
        }

        .aes-key-block p {
            color: #85c1e9;
            margin: 0;
            font-size: clamp(11px, 1.5vw, 12px);
            background: #1a1a1a;
            padding: 10px;
            border-radius: 4px;
            word-break: break-all;
            min-height: 40px;
        }

        .tooltip {
            position: absolute;
            background: #2c3e50;
            color: #ecf0f1;
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.6;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid #3498db;
            z-index: 1001;
            animation: tooltipFadeIn 0.3s ease;
            word-wrap: break-word;
        }

        .tooltip::before {
            content: '';
            position: absolute;
            top: -10px;
            left: 20px;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-bottom: 10px solid #3498db;
        }

        @keyframes tooltipFadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .connection-status {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            color: #e74c3c;
            font-size: clamp(12px, 1.5vw, 14px);
            background: #2d2d2d;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid #e74c3c;
            text-align: center;
            z-index: 1000;
            max-width: 300px;
            margin: 0 auto;
        }

        .connection-status.connected {
            color: #2ecc71;
            border-color: #2ecc71;
        }

        @media (max-width: 1024px) {
            .content-wrapper {
                gap: 20px;
            }
            
            .left-column,
            .right-column {
                min-width: 280px;
            }
            
            .tooltip {
                max-width: 300px;
                font-size: 13px;
            }
        }

        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            .main-menu-container {
                padding: 10px;
            }

            .content-wrapper {
                flex-direction: column;
                gap: 15px;
            }

            .left-column,
            .right-column {
                min-width: 100%;
            }

            .buttons-container {
                flex-direction: column;
            }

            .mail-btn,
            .aes-btn {
                width: 100%;
                text-align: center;
            }

            .text-input {
                min-height: 100px;
                font-size: 16px;
            }

            .connection-status {
                left: 10px;
                right: 10px;
                bottom: 10px;
                max-width: calc(100% - 20px);
            }
            
            .tooltip {
                max-width: 250px;
                font-size: 12px;
                position: fixed;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
            }
            
            .tooltip::before {
                display: none;
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 1.3rem;
            }

            .title-1 {
                font-size: 0.8rem;
            }

            .aes-key-block {
                padding: 10px;
            }

            .aes-key-block h3 {
                font-size: 0.85rem;
            }
            
            .tooltip {
                max-width: 90vw;
                font-size: 11px;
            }
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #1a1a1a;
        }

        ::-webkit-scrollbar-thumb {
            background: #2c8853;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #50f394;
        }

        .notification {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #e74c3c;
            color: white;
            padding: 12px 24px;
            border-radius: 16px;
            border: 2px solid #c0392b;
            font-size: 16px;
            z-index: 100;
            opacity: 0;
            animation: notificationFadeIn 0.3s ease forwards, notificationFadeOut 0.5s ease 2.5s forwards;
        }

        @keyframes notificationFadeIn {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        @keyframes notificationFadeOut {
            from {
                opacity: 1;
            }
            to {
                opacity: 0;
                transform: translateX(-50%) translateY(-10px);
            }
        }

        @media (max-width: 768px) {
            .notification {
                width: 90%;
                text-align: center;
                font-size: 14px;
                padding: 10px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="main-menu-container">
        <h1>Передача сообщений</h1>
        
        <div class="title-1">
            <h2>Отправляйте сообщения</h2>
        </div>

        <div class="content-wrapper">
            <div class="left-column">
                <form class="text-form" id="text-form">
                    <div class="text-group">
                        <textarea class="text-input"
                                  id="text-input"
                                  placeholder="Напишите что-нибудь..."
                                  rows="5"></textarea>
                    </div>
                    
                    <div class="buttons-container">
                        <button type="submit" class="mail-btn" id="mail-btn">Отправить</button>
                        <button type="button" class="aes-btn" id="aes-btn">Сгенерировать AES ключ</button>
                    </div>
                </form>
            </div>

            <div class="right-column">
                <div class="aes-key-block">
                    <h3 id="aes-key-title">AES ключ</h3>
                    <p id="aes-key-value"></p>
                </div>
            </div>
        </div>

        <div class="connection-status" id="connection-status">
            Статус: отключен
        </div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const TextInput = document.getElementById('text-input');
            const MailBtn = document.getElementById('mail-btn');
            const AESBtn = document.getElementById('aes-btn');
            const AESKeyValue = document.getElementById('aes-key-value');
            const AESKeyTitle = document.getElementById('aes-key-title');
            const ConnectionStatus = document.getElementById('connection-status');
            const TextForm = document.getElementById('text-form');
            
            let currentTooltip = null;
            let ws = null;
            let reconnectAttempts = 0
            const reconnectDelay = 3000;

            function connectWebsocket() {
                ws = new WebSocket('ws://185.255.133.17:8081/ws');

                ws.addEventListener('open', (event) => {
                    ConnectionStatus.textContent = 'Статус: Подключен';
                    ConnectionStatus.classList.add('connected');
                    reconnectAttempts = 0;
                });

                ws.addEventListener('message', (event) => {
                    const data = JSON.parse(event.data);
                    console.log(event.data);

                    if (data.AES_key) {
                        AESKeyValue.textContent = data.AES_key;
                    }
                });

                ws.addEventListener('error', (event) => {
                    console.log('Произошла WebSocket ошибка: ', event.data);
                    ConnectionStatus.textContent = 'Статус: ошибка';
                    ConnectionStatus.classList.remove('connected');
                });

                ws.addEventListener('close', (event) => {
                    console.log('Соединение закрыто: ', event.code, event.reason);
                    ConnectionStatus.textContent = 'Статус: отключен';
                    ConnectionStatus.classList.remove('connected');

                    attemptReconnect();
                });
            }

            function attemptReconnect() {
                reconnectAttempts++;

                setTimeout(() => {
                    console.log(`Попытка переподключения: ${reconnectAttempts}`);
                    connectWebsocket();
                }, reconnectDelay);
            }

            connectWebsocket();
            //окончание блока подключения по WebSocket

            MailBtn.addEventListener('click', (event) => {
                event.preventDefault();
                sendMessage(TextInput.value.trim());
            });

            AESBtn.addEventListener('click', (event) => {
                if (ws.readyState !== WebSocket.OPEN) {
                    console.log('Невозможно сгенерировать ключ, т.к. нет WebSocket');
                    return;
                }

                ws.send(JSON.stringify({
                    AES_key: ""
                }));
            });

            TextForm.addEventListener('submit', (event) => {
                event.preventDefault();
            });

            function showTooltip(element, text) {
                removeTooltip();
                
                const tooltip = document.createElement('div');
                tooltip.className = 'tooltip';
                tooltip.textContent = text;
                
                const rect = element.getBoundingClientRect();
                const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
                
                if (window.innerWidth <= 768) {
                    tooltip.style.position = 'fixed';
                    tooltip.style.top = '50%';
                    tooltip.style.left = '50%';
                } else {
                    tooltip.style.position = 'absolute';
                    tooltip.style.top = rect.bottom + scrollTop + 10 + 'px';
                    tooltip.style.left = rect.left + 'px';
                }
                
                document.body.appendChild(tooltip);
                currentTooltip = tooltip;
                
                setTimeout(() => {
                    document.addEventListener('click', closeTooltipOnClickOutside);
                    document.addEventListener('touchstart', closeTooltipOnClickOutside);
                }, 0);
            }
            
            function removeTooltip() {
                if (currentTooltip) {
                    currentTooltip.remove();
                    currentTooltip = null;
                    document.removeEventListener('click', closeTooltipOnClickOutside);
                    document.removeEventListener('touchstart', closeTooltipOnClickOutside);
                }
            }
            
            function closeTooltipOnClickOutside(event) {
                if (currentTooltip && !currentTooltip.contains(event.target) && event.target !== AESKeyTitle) {
                    removeTooltip();
                }
            }
            
            AESKeyTitle.addEventListener('click', (event) => {
                event.stopPropagation();
                
                const tooltipText = 'AES-ключ — это секретная последовательность байтов, которая используется алгоритмом симметричного шифрования AES (Advanced Encryption Standard) для преобразования открытых данных в зашифрованный вид и обратно. Поскольку AES — симметричный алгоритм, один и тот же ключ применяется как для шифрования, так и для расшифровки.';
                
                if (currentTooltip) {
                    removeTooltip();
                } else {
                    showTooltip(AESKeyTitle, tooltipText);
                }
            });

            function showRedNotification(message) {
                const lastNotification = document.querySelector('.notification');
                if (lastNotification) {
                    lastNotification.remove();
                }

                const notification = document.createElement('div');
                notification.className = 'notification';
                notification.textContent = message;

                document.body.appendChild(notification);

                setTimeout(() => {
                    if (notification.parentNode) {
                        notification.remove();
                    }
                }, 3000);
            }

            function sendMessage(message) {
                if(!message) return;

                if (ws.readyState !== WebSocket.OPEN) {
                    console.log('Невозможно отправить сообщение, т.к. WebSocket не подключен');
                    showRedNotification('Невозможно отправить сообщение, т.к. нет подключения');
                    return;
                }

                ws.send(JSON.stringify({
                    message: message
                }));

                TextInput.value = '';
            }

            window.addEventListener('online', () => {
                if (!ws || ws.readyState === WebSocket.CLOSED) {
                    ConnectionStatus.textContent = 'Статус: переподключение...';
                    reconnectAttempts = 0;
                    connectWebsocket();
                }
            });

            window.addEventListener('offline', () => {
                ConnectionStatus.textContent = 'Статус: нет интернета';
                ConnectionStatus.classList.remove('connected');

                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.close();
                }
            });
            
            window.addEventListener('resize', () => {
                if (currentTooltip) {
                    removeTooltip();
                }
            });
        });
    </script>
</body>
</html>
