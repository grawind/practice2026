<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Передача сообщений посредством алгоритмов шифрования</title>

    <link rel="stylesheet" href="styles/main_style.css">
</head>
<body>
    <div class="main-menu-container">
        <h1>Передача сообщений посредством алгоритмов шифрования</h1>

        <form class="text-form" id="text-form">
            <div class="text-group">
                <textarea class="text-input"
                          id="text-input"
                          placeholder="Напишите что-нибудь..."
                          cols="100"></textarea>
            </div>


            <button type="submit" class="mail-btn" id="mail-btn"><span class="btn-text">Отправить</span></button>
        </form>

        <div class="title-1" id="title-1">
            <h2>Переписка</h2>
        </div>

        <div class="correspondence" id="correspondence">
            <textarea class="text-output" 
                      id="text-output" 
                      placeholder="Здесь будет отображаться ваша история переписки..."
                      readonly></textarea>
        </div>
    </div>
    
    <script src="scripts/main.js"></script>
</body>
</html>
